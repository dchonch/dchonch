name: Metrics
on:
  # Schedule updates (weekly, Mondays)
  schedule: [{cron: "0 6 * * 1"}]
  # Run workflow manually (optional)
  workflow_dispatch:

jobs:

  achievements:
    timeout-minutes: 30
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - uses: dchonch/metrics@master
        with:
          filename: achievements.svg
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.METRICS_SECRET }}
          user: dchonch
          base: achievements
          plugin_achievements: yes
          plugin_achievements_threshold: B      # Display achievements with rank B or higher
          plugin_achievements_secrets: yes      # Display unlocked secrets achievements
          plugin_achievements_display: compact  # Use compact display
          plugin_achievements_limit: 0          # Display all unlocked achievements (no limit)

  github-metrics:
    timeout-minutes: 30
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - uses: dchonch/metrics@master
        with:
          filename: header.svg
          # You'll need to setup a personal token in your secrets.
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.METRICS_SECRET }}

          # Options
          user: dchonch
          template: classic
          base: header
          config_timezone: ${{ secrets.USER_TIMEZONE }}

  acti_comm:
    timeout-minutes: 30
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - uses: dchonch/metrics@master
        with:
          filename: acti_comm.svg
          # You'll need to setup a personal token in your secrets.
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.METRICS_SECRET }}

          # Options
          user: dchonch
          template: classic
          base: activity, community
          config_timezone: ${{ secrets.USER_TIMEZONE }}

  iso_calender:
    timeout-minutes: 30
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - uses: dchonch/metrics@master
        with:
          filename: iso_calender.svg
          # You'll need to setup a personal token in your secrets.
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.METRICS_SECRET }}

          # Options
          user: dchonch
          template: classic
          base: ""
          config_timezone: ${{ secrets.USER_TIMEZONE }}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

  habits:
    timeout-minutes: 30
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - uses: dchonch/metrics@master
        with:
          filename: github-habits.svg
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.METRICS_SECRET }}
          config_timezone: ${{ secrets.USER_TIMEZONE }} # Set timezone
          user: dchonch
          base: ""
          template: classic
          plugin_habits: yes
          plugin_habits_from: 200       # Use 200 events to compute habits
          plugin_habits_days: 14        # Keep only events from last 14 days
          plugin_habits_charts: yes     # Display charts section
          plugin_habits_trim: yes       # Trim unused hours on daily chart

  issue_pr_lang:
    timeout-minutes: 30
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - uses: dchonch/metrics@master
        with:
          filename: issue_pr_lang.svg
          # You'll need to setup a personal token in your secrets.
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.METRICS_SECRET }}

          # Options
          user: dchonch
          template: classic
          base: ""
          config_timezone: ${{ secrets.USER_TIMEZONE }}
          plugin_followup: yes
          plugin_languages: yes


  repositories:
    timeout-minutes: 30
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - uses: dchonch/metrics@master
        with:
          filename: repositories.svg
          # You'll need to setup a personal token in your secrets.
          token: ${{ secrets.METRICS_SECRET }}
          committer_token: ${{ secrets.METRICS_SECRET }}

          # Options
          user: dchonch
          template: classic
          base: repositories
          config_timezone: ${{ secrets.USER_TIMEZONE }}
